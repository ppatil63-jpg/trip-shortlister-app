<!DOCTYPE html>
<!-- Trip Shortlister scorecard widget.
     Served by the MCP server as a resource with MIME type text/html+skybridge.
     ChatGPT renders this inline in the chat via the window.openai bridge.
     No external dependencies (CSP-friendly). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #8884; }
  th { opacity: .7; font-weight: 600; }
  .total { font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: #8883; margin-top: 4px; }
  .bar > div { height: 100%; border-radius: 3px; background: #10a37f; }
  .note { font-size: 12px; opacity: .7; margin-top: 12px; }
</style>
</head>
<body>
<h2>Trip shortlist</h2>
<div id="app">Loading…</div>
<div class="note" id="note"></div>
<script>
  function render(data) {
    const app = document.getElementById('app');
    if (!data || !data.results || !data.results.length) {
      app.textContent = 'No destinations scored yet.';
      return;
    }
    let html = '<table><tr><th>#</th><th>Destination</th><th>Total</th><th>Why</th></tr>';
    data.results.slice(0, 8).forEach((r, i) => {
      const s = r.scores || {};
      const pct = Math.round((r.weighted_total / 10) * 100);
      html += '<tr><td>' + (i + 1) + '</td>'
        + '<td><strong>' + escapeHtml(r.destination) + '</strong><br><span style="opacity:.7">~$'
        + r.est_daily_cost_usd + '/day · ' + escapeHtml(r.best_months || '') + '</span>'
        + '<div class="bar"><div style="width:' + pct + '%"></div></div></td>'
        + '<td class="total">' + r.weighted_total + '</td>'
        + '<td style="font-size:12px">interest ' + s.interest + ' · budget ' + s.budget
        + ' · reviews ' + s.reviews + '</td></tr>';
    });
    html += '</table>';
    app.innerHTML = html;
    document.getElementById('note').textContent =
      'Weights: ' + Object.entries(data.weights || {}).map(([k, v]) => k + ' ' + v + '%').join(' · ')
      + '. Review scores stay neutral until live review tools return data.';
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function init() {
    const out = window.openai && window.openai.toolOutput;
    if (out && out.structuredContent) { render(out.structuredContent); return; }
    // Bridge not ready yet — retry briefly.
    let tries = 0;
    const t = setInterval(() => {
      const o = window.openai && window.openai.toolOutput;
      if ((o && o.structuredContent) || ++tries > 20) { clearInterval(t); render(o && o.structuredContent); }
    }, 250);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
</html>
